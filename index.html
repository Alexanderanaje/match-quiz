<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>Alexander / Match</title>
  <style>
    :root{--bg:#f6f3ee;--card:#fff;--text:#171717;--muted:#757575;--line:#e6e0d8;--accent:#111;--ok:#1f6f50;--soft:#eee8df}
    *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
    body{min-height:100svh}.wrap{max-width:680px;margin:0 auto;padding:24px 18px calc(40px + env(safe-area-inset-bottom))}
    .brand{font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin:6px 0 28px}.hero{padding:22px 0 24px}
    .kicker{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
    h1{font-family:Georgia,serif;font-size:clamp(42px,11vw,68px);line-height:.98;font-weight:500;margin:0 0 18px}.lead{font-size:18px;line-height:1.55;color:#4f4b45}
    .about{margin-top:20px;padding:16px 18px;background:var(--soft);border-radius:16px;font-size:14px;line-height:1.55;color:#504b44}
    .about b{color:var(--text)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.07)}
    label{font-size:13px;font-weight:700;color:var(--muted)} input[type=text]{width:100%;font-size:16px;margin-top:8px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff}
    button{font:inherit;cursor:pointer}.btn{width:100%;border:0;border-radius:999px;padding:16px 20px;background:var(--accent);color:#fff;font-weight:800;font-size:16px;margin-top:16px}.btn:disabled{opacity:.35;cursor:default}.btn.secondary{background:#ebe6df;color:#222;width:auto;margin:0}
    .progressbox{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 78%,rgba(246,243,238,0));padding:12px 0 18px}.prow{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:8px}.progress{height:8px;border-radius:99px;background:#e5ded5;overflow:hidden}.progress span{display:block;height:100%;background:#111;border-radius:99px;transition:.2s}
    .qnum{text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:800;color:var(--muted)}.qtext{font-family:Georgia,serif;font-size:27px;line-height:1.18;margin:12px 0 22px}
    .options{display:grid;gap:10px}.option{border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px;text-align:left;font-size:16px;line-height:1.4;min-height:58px}.option.sel{border:2px solid #111;background:#faf8f5;padding:15px}
    .nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px}.nav .btn{width:auto;margin:0;min-width:120px}.small{font-size:13px;line-height:1.5;color:var(--muted)}
    .done{text-align:center;padding:42px 22px}.check{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px;background:#e7f2ec;color:var(--ok);font-size:30px;font-weight:900}.done h2{font-family:Georgia,serif;font-size:42px;font-weight:500;margin:0 0 12px}
    .lovebox{margin-top:28px;padding:20px;border-radius:18px;background:#f5eee8;border:1px solid #eaded3}.lovebox h3{font-family:Georgia,serif;font-size:24px;font-weight:500;margin:0 0 8px}.lovebox p{margin:0;color:#665f57;font-size:14px;line-height:1.5}.lovebtn{background:#6f2f3d;margin-top:16px}.love-note{display:none;margin-top:14px;font-size:14px;font-weight:700;color:#6f2f3d}
    @media(max-width:480px){.wrap{padding-left:14px;padding-right:14px}.card{padding:20px}.qtext{font-size:24px}.option{font-size:15px}.done{padding:36px 16px}}
  </style>
</head>
<body>
<div class="wrap" id="app"></div>

<form name="match-quiz" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden id="netlifyForm">
  <input type="hidden" name="form-name" value="match-quiz" />
  <input name="bot-field" />
  <input name="name" />
  <input name="q1"/><input name="q2"/><input name="q3"/><input name="q4"/><input name="q5"/><input name="q6"/><input name="q7"/><input name="q8"/>
  <input name="q9"/><input name="q10"/><input name="q11"/><input name="q12"/><input name="q13"/><input name="q14"/><input name="q15"/><input name="q16"/>
  <input name="q17"/><input name="q18"/><input name="q19"/><input name="q20"/><input name="q21"/><input name="q22"/><input name="q23"/><input name="q24"/>
  <input name="q25"/><input name="q26"/><input name="q27"/><input name="q28"/><input name="q29"/><input name="q30"/><input name="q31"/><input name="q32"/>
</form>
<script>
const questions = [
["Din partner vill åka på en fyradagars resa med sina vänner. Vad ligger närmast dig?",["Härligt, egna upplevelser är bra för relationen.","Absolut, så länge båda får samma frihet.","Okej ibland, men jag skulle helst vilja följa med.","I en seriös relation bör sådana resor vara ovanliga."]],
["Din partner kommer hem betydligt senare än planerat utan att höra av sig.",["Jag frågar vad som hände och släpper det om förklaringen är rimlig.","Jag blir irriterad men tar samtalet lugnt nästa dag.","Jag behöver veta var personen varit och med vilka.","Jag hade sett det som ett allvarligt respektproblem."]],
["Hur ser din perfekta lördag oftast ut?",["Hemma tillsammans nästan hela dagen.","Träning eller egna aktiviteter på dagen och middag tillsammans på kvällen.","Aktiv dag, middag med vänner och kanske drinkar senare.","Spontant – jag vill helst inte planera."]],
["Hur viktigt är det för dig att få barn?",["Mycket viktigt.","Jag tror att jag vill det.","Osäker.","Jag vill inte ha barn."]],
["Om relationen känns rätt, när skulle barn kännas aktuellt?",["Inom 1–3 år.","Inom 3–5 år.","Om 6–7 år eller senare.","Jag vill inte planera barn."]],
["Din partner får ett meddelande från ett ex. Han berättar det själv och visar att samtalet är oskyldigt.",["Jag uppskattar öppenheten och tänker inte mer på det.","Jag vill förstå varför exet hör av sig men litar på honom.","Jag vill att kontakten avslutas.","Kontakt med ex är inte acceptabelt för mig."]],
["Hur mycket gemensam tid behöver du normalt i en relation?",["Nästan all ledig tid.","Mycket, men båda behöver egna liv.","Några riktigt bra stunder i veckan räcker om relationen är trygg.","Jag behöver väldigt mycket egentid."]],
["Ni har ett stort gräl. Vad gör du helst?",["Löser allt direkt, även om diskussionen blir intensiv.","Tar en paus och pratar lugnt när båda landat.","Behöver vara ifred ganska länge innan jag pratar.","Vill helst släppa konflikten utan att älta."]],
["Hur viktigt är ett eget yrkesliv eller projekt för dig?",["Väldigt viktigt för min identitet.","Viktigt att ha något eget och kunna stå på egna ben.","Trevligt, men relation och familj kommer klart först.","Jag skulle gärna låta min partner bära huvuddelen ekonomiskt."]],
["Partnern tjänar betydligt mer än du.",["Inga problem; ekonomi behöver inte vara jämn.","Bra, så länge jag fortfarande har mitt eget.","Jag skulle vilja bidra ungefär lika mycket.","Jag skulle känna mig obekväm med stor ekonomisk skillnad."]],
["Hur använder du sociala medier?",["Väldigt lite och mest privat.","Aktivt men ganska vardagligt.","Mycket; jag gillar att dela mitt liv och få respons.","Det är en viktig del av min identitet och mitt sociala liv."]],
["Din partner är ute på middag och svarar inte på telefon på tre timmar.",["Jag tänker att han har trevligt.","Jag kan undra men väntar tills han hör av sig.","Jag skickar fler meddelanden för att kontrollera att allt är okej.","Jag skulle bli ordentligt upprörd."]],
["Vad låter mest som ett bra förhållande?",["Två personer som nästan gör allt tillsammans.","Två självständiga personer som aktivt väljer varandra.","Ett väldigt intensivt och passionerat förhållande.","Ett stabilt och praktiskt partnerskap."]],
["Hur ofta vill du ungefär träffa vänner utan din partner?",["Nästan aldrig.","Någon gång ibland.","Regelbundet.","Väldigt ofta."]],
["Partnern vill spela golf en hel dag på helgen.",["Perfekt, då gör jag något eget.","Absolut, om vi också prioriterar tid tillsammans.","Okej ibland men inte särskilt ofta.","Helger tycker jag främst ska vara gemensamma."]],
["Hur känner du inför sena middagar, restauranger och spontana kvällar?",["Älskar det.","Gillar det ibland.","Föredrar oftast lugna hemmakvällar.","Det är sällan min grej."]],
["Vad betyder trohet mest för dig?",["Tydlig exklusivitet både fysiskt och emotionellt.","Fysisk trohet är viktigast.","Varje par får definiera sina egna gränser.","Jag skulle kunna tänka mig en öppnare relation."]],
["Om du känner dig osäker i relationen, vad gör du?",["Säger vad jag känner och pratar om det.","Tänker igenom det först och tar sedan upp det.","Söker mer uppmärksamhet från partnern.","Drar mig undan för att se om partnern kommer efter."]],
["Din partner vill resa utomlands själv några dagar.",["Inga problem.","Okej om relationen i övrigt känns prioriterad.","Jag skulle känna mig obekväm.","Jag tycker att sådana resor bör göras tillsammans."]],
["Ni har små barn. Hur bör friheten fungera?",["Båda ska fortfarande kunna resa och göra egna saker.","Båda ska ha frihet, men den måste vara rättvis och praktiskt fungera.","Det mesta bör göras tillsammans under småbarnsåren.","Individuella resor och nöjen bör i princip pausas."]],
["Vad gör ett förhållande roligt efter flera år?",["Humor och att kunna retas och skratta tillsammans.","Resor och nya upplevelser.","Ett stort gemensamt socialt liv.","Stabil vardag och gemensamma rutiner."]],
["Partnern har haft en riktigt stressig arbetsvecka och är mindre närvarande.",["Jag ger utrymme och finns där.","Jag frågar vad personen behöver.","Jag behöver ändå känna att relationen prioriteras.","Jag skulle snabbt börja känna mig bortvald."]],
["Hur viktigt är fysisk närhet och sex för en lång relation?",["Ganska oviktigt.","Viktigt men inte centralt.","Mycket viktigt.","En av relationens absolut viktigaste delar."]],
["Om sexlivet blir sämre under en längre period:",["Jag tar upp det öppet och försöker lösa det tillsammans.","Jag ger det tid först och pratar sedan.","Jag skulle börja ifrågasätta relationen.","Jag accepterar att sådant naturligt försvinner."]],
["Partnern har nära vänner av motsatt kön.",["Helt okej med tydliga gränser och tillit.","Okej om jag känner dem och känner mig trygg.","Jag skulle helst inte vilja det.","Det fungerar inte för mig."]],
["Vad beskriver bäst ditt förhållande till drama?",["Jag undviker onödiga konflikter och vill lösa saker lugnt.","Lite temperament gör relationen levande.","Jag kan bli intensiv men lugnar mig snabbt.","Starka bråk hör till passionerade relationer."]],
["Hur vill du helst dela ekonomin i en lång relation?",["Båda behåller mycket självständighet men bygger också något gemensamt.","Vi delar det mesta gemensamt.","Den som tjänar mest bör stå för klart mest.","Jag har ingen särskild preferens."]],
["Partnern får en möjlighet att göra något han verkligen vill, men du kan inte följa med.",["Jag uppmuntrar honom att göra det.","Jag är positiv men vill att vi planerar något gemensamt också.","Jag blir besviken om han väljer att åka.","Jag tycker att större upplevelser bör göras som par."]],
["Vilken partner känns mest attraktiv som person?",["Lugn, trygg och självsäker.","Väldigt spontan och intensiv.","Extremt ambitiös och prestationsdriven.","Väldigt omhändertagande och relationsfokuserad."]],
["Om ni får barn och den ena tjänar betydligt mer:",["Vi hittar den fördelning som fungerar bäst praktiskt.","Jag kan tänka mig att dra ner på jobbet och ta mer ansvar hemma.","Allt ska ändå delas exakt lika.","Jag vill helst fortsätta prioritera min egen karriär lika mycket."]],
["När känner du dig som tryggast i kärlek?",["När vi litar på varandra även när vi är ifrån varandra.","När vi har mycket kontakt och gör mycket tillsammans.","När partnern ofta visar och säger hur viktig jag är.","När jag vet ganska exakt vad partnern gör och planerar."]],
["Vilket liv låter mest attraktivt om tio år?",["Familj, trygg relation, resor, vänner och samtidigt egna intressen.","Väldigt familjecentrerat liv där nästan allt görs tillsammans.","Mycket resor, socialt liv och spontanitet, barn får komma om det passar.","Karriär, frihet och upplevelser prioriteras framför familjebildning."]]
];
const keys=["A","B","C","D"]; let state={name:"",i:0,answers:{}}; const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
function start(){app.innerHTML=`<div class="brand">Alexander / Match</div><section class="hero"><div class="kicker">Ett högst seriöst experiment</div><h1>Okej. Vi testar en sak.</h1><p class="lead">Jag heter Alexander och jag har tydligen gått så långt att jag byggt ett eget relationsquiz. Inte för att hitta “rätt” svar – utan för att se om vi faktiskt tänker lika om det som betyder något.</p><div class="about"><b>Kort om mig:</b> Jag gillar frihet, tillit, familj, humor och ett liv där det händer saker. Jag tror på två självständiga personer som väljer varandra – och helst har väldigt kul på vägen.</div></section><section class="card"><label>Vad heter du?<input id="name" type="text" autocomplete="given-name" placeholder="Ditt förnamn"></label><button class="btn" id="go">Nu kör vi →</button><p class="small">32 frågor · cirka 5–7 minuter · svara spontant.</p></section>`;document.getElementById('go').onclick=()=>{const n=document.getElementById('name').value.trim();if(!n){document.getElementById('name').focus();return}state.name=n;render()}}
function render(){let [text,opts]=questions[state.i],selected=state.answers[state.i];app.innerHTML=`<div class="brand">Alexander / Match</div><div class="progressbox"><div class="prow"><span>Fråga ${state.i+1} av 32</span><span>${Math.round(state.i/32*100)}%</span></div><div class="progress"><span style="width:${state.i/32*100}%"></span></div></div><section class="card"><div class="qnum">Välj det som ligger närmast dig</div><div class="qtext">${esc(text)}</div><div class="options">${opts.map((o,j)=>`<button class="option ${selected===keys[j]?'sel':''}" data-k="${keys[j]}"><b>${keys[j]}</b>&nbsp;&nbsp;${esc(o)}</button>`).join('')}</div><div class="nav"><button class="btn secondary" id="prev" ${state.i===0?'disabled':''}>← Tillbaka</button><button class="btn" id="next" ${selected?'':'disabled'}>${state.i===31?'Skicka':'Nästa →'}</button></div></section>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{state.answers[state.i]=b.dataset.k;render()});document.getElementById('prev').onclick=()=>{if(state.i>0){state.i--;render()}};document.getElementById('next').onclick=()=>{if(!state.answers[state.i])return;if(state.i<31){state.i++;render()}else submit()}}
async function submit(){const form=document.getElementById('netlifyForm');form.elements['name'].value=state.name;for(let i=0;i<32;i++)form.elements[`q${i+1}`].value=state.answers[i]||'';const body=new URLSearchParams(new FormData(form)).toString();try{const r=await fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});if(!r.ok)throw new Error();done()}catch(e){alert('Kunde inte skicka just nu. Försök igen om en stund.')}}
function done(){app.innerHTML=`<div class="brand">Alexander / Match</div><section class="card done"><div class="check">✓</div><h2>Du klarade dig.</h2><p class="lead">Tack ${esc(state.name)}. Dina svar är sparade. Nu återstår bara den helt ovetenskapliga delen: om vi faktiskt gillar varandra.</p><div class="lovebox"><h3>Vill du ha kärleksbrev? 💌</h3><p>För dig som tycker att 32 frågor inte var tillräckligt stor risk.</p><button class="btn lovebtn" id="love">Signa upp för kärleksbrev</button><div class="love-note" id="loveNote">Registrerad. Leveransdatum: högst oklart. ❤️</div></div></section>`;document.getElementById('love').onclick=()=>{document.getElementById('love').style.display='none';document.getElementById('loveNote').style.display='block'}}
start();
</script>
</body>
</html>
