<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f6f3ee" />
<title>Therese Match Quiz – Alexander Edition</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--text:#171717;--muted:#757575;--line:#e6e0d8;--accent:#111;--ok:#1f6f50;--heart:#e3264f}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}body{min-height:100svh}.wrap{max-width:680px;margin:0 auto;padding:24px 18px calc(44px + env(safe-area-inset-bottom))}.brand{font-weight:850;font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:6px 0 28px;display:flex;align-items:center;gap:8px}.brand-dot{width:9px;height:9px;border-radius:50%;background:var(--heart)}.hero{padding:20px 0 26px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:12px}h1{font-family:Georgia,serif;font-size:clamp(42px,11vw,68px);line-height:.98;font-weight:500;margin:0 0 18px}.lead{font-size:18px;line-height:1.58;color:#4f4b45;margin:0}.intro-note{margin-top:18px;padding:15px 16px;border:1px solid var(--line);border-radius:16px;background:#fbf9f5;color:#605a53;font-size:14px;line-height:1.55}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.07)}button{font:inherit;-webkit-tap-highlight-color:transparent}.start-btn{width:100%;border:0;border-radius:999px;padding:16px 20px;background:var(--accent);color:#fff;font-weight:850;font-size:16px;margin-top:16px;cursor:pointer}.progressbox{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 78%,rgba(246,243,238,0));padding:12px 0 18px}.prow{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:750;margin-bottom:8px}.progress{height:8px;border-radius:99px;background:#e5ded5;overflow:hidden}.progress span{display:block;height:100%;background:var(--heart);border-radius:99px;transition:.2s}.qnum{text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:850;color:var(--muted)}.qtext{font-family:Georgia,serif;font-size:27px;line-height:1.18;margin:12px 0 22px}.options{display:grid;gap:10px}.option{border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px;text-align:left;font-size:16px;line-height:1.4;min-height:58px;cursor:pointer;transition:.12s ease}.option.sel{border:2px solid var(--heart);background:#fff7f9;padding:15px;box-shadow:0 0 0 2px rgba(227,38,79,.08)}.nav{position:relative;display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:24px;min-height:128px;padding:0 8px}.back-btn{position:relative;border:1px solid var(--line);background:#eee9e2;color:#25221f;padding:13px 17px;border-radius:999px;font-size:14px;font-weight:750;cursor:pointer;transition:transform .16s ease;z-index:3;white-space:nowrap}.back-btn:disabled{opacity:.28;cursor:default;transform:none!important}.heart-wrap{width:116px;height:106px;position:relative;display:flex;align-items:flex-end;justify-content:center;flex:0 0 116px}.heart-btn{position:relative;width:74px;height:74px;border:0;background:var(--heart);transform:rotate(-45deg);cursor:pointer;box-shadow:0 12px 26px rgba(227,38,79,.28);z-index:2}.heart-btn::before,.heart-btn::after{content:"";position:absolute;width:74px;height:74px;background:var(--heart);border-radius:50%}.heart-btn::before{top:-37px;left:0}.heart-btn::after{left:37px;top:0}.heart-btn:disabled{opacity:.28;cursor:default;box-shadow:none}.heart-label{position:absolute;z-index:5;inset:-18px -22px -22px -18px;display:flex;align-items:center;justify-content:center;transform:rotate(45deg);color:#fff;font-size:13px;font-weight:900;text-align:center;line-height:1.05;pointer-events:none}.small{font-size:13px;line-height:1.5;color:var(--muted)}.done{text-align:center;padding:44px 8px}.check{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px;background:#e7f2ec;color:var(--ok);font-size:30px;font-weight:900}.done h2{font-family:Georgia,serif;font-size:44px;font-weight:500;margin:0 0 12px}@media(max-width:480px){.wrap{padding-left:14px;padding-right:14px}.card{padding:20px}.qtext{font-size:24px}.option{font-size:15px}.nav{min-height:118px;padding:0}.heart-wrap{width:108px;flex-basis:108px}.heart-btn,.heart-btn::before,.heart-btn::after{width:68px;height:68px}.heart-btn::before{top:-34px}.heart-btn::after{left:34px}.heart-label{font-size:12px}.back-btn{padding:12px 15px;font-size:13px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<form name="match-quiz" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden id="netlifyForm">
<input type="hidden" name="form-name" value="match-quiz"/><input name="bot-field"/><input name="name"/>
<input name="q1"/><input name="q2"/><input name="q3"/><input name="q4"/><input name="q5"/><input name="q6"/><input name="q7"/><input name="q8"/>
<input name="q9"/><input name="q10"/><input name="q11"/><input name="q12"/><input name="q13"/><input name="q14"/><input name="q15"/><input name="q16"/>
<input name="q17"/><input name="q18"/><input name="q19"/><input name="q20"/><input name="q21"/><input name="q22"/><input name="q23"/><input name="q24"/>
<input name="q25"/><input name="q26"/><input name="q27"/><input name="q28"/><input name="q29"/><input name="q30"/><input name="q31"/><input name="q32"/>
</form>
<script>
const questions=[
["I en riktigt bra relation, hur mycket av den lediga tiden vill du helst spendera tillsammans?",["Nästan all ledig tid – vi är ett team i det mesta.","Mycket tid ihop, men båda ska ha ett eget liv också.","Några riktigt bra stunder i veckan räcker om relationen är trygg.","Jag behöver betydligt mer egentid än gemensam tid."]],
["Du får en spontan chans att åka iväg fyra dagar med kompisar. Vad känns mest rimligt?",["Jag åker gärna – egna upplevelser är bra för relationen.","Jag åker om vi också har prioriterat vår gemensamma tid.","Jag hade nog avstått för att inte skapa onödig friktion.","I en seriös relation bör sådana resor främst göras tillsammans."]],
["Hur viktigt är det för dig att du och din partner kan umgås naturligt med varandras vänner?",["Väldigt viktigt – jag vill att världarna ska kunna mötas.","Ganska viktigt, men vi behöver inte dela alla vänner.","Trevligt men långt ifrån avgörande.","Jag föredrar att hålla våra sociala liv ganska separata."]],
["Du vill spela golf eller göra en egen hobby en hel dag på helgen. Hur tänker du?",["Perfekt – då kan min partner göra något eget.","Absolut, så länge vi också får bra tid tillsammans.","Okej ibland, men jag tycker inte det ska bli ofta.","Helger bör i huvudsak vara gemensamma."]],
["Vad betyder det mest konkret för dig att prioritera en relation?",["Att finnas där när det verkligen gäller.","Att regelbundet planera riktig kvalitetstid tillsammans.","Att ha mycket kontakt och små bekräftelser varje dag.","Att partnern ofta ska väljas framför andra aktiviteter."]],
["När ni inte ses under en vanlig dag, hur mycket kontakt vill du helst ha?",["Några meddelanden räcker fint.","Kontakt morgon och kväll och lite däremellan.","Ganska löpande kontakt under dagen.","Väldigt mycket kontakt för att relationen ska kännas nära."]],
["Du blir flera timmar senare än du sagt och har inte hört av dig. Hur allvarligt tycker du att det är?",["Inte särskilt – jag förklarar när jag kommer hem.","Onödigt och lite respektlöst, men inte en stor grej.","Tydligt respektlöst – jag borde ha hört av mig.","Min partner borde förstå att sådant händer utan att reagera."]],
["Du driver företag och har en extremt intensiv jobbperiod. Vad är mest rimligt?",["Jobbet får styra – ambition kräver ibland att relationen väntar.","Jag kör hårt men ser aktivt till att relationen fortfarande känns prioriterad.","Jag skulle dra ner arbetet snabbt för relationens skull.","Jag vill helst inte leva ett liv med perioder av mycket jobb."]],
["Hur viktig är ambition hos dig själv och en partner?",["Extremt viktig – jag behöver mycket driv runt mig.","Viktig och attraktiv, men inte på bekostnad av allt annat.","Bra att ha, men ganska oviktig för relationen.","Stabilitet är viktigare än ambition."]],
["Vilken roll ska pengar spela i ett bra gemensamt liv?",["Ekonomisk framgång är ett av de viktigaste målen.","Pengar ger frihet och är därför ganska viktiga.","Pengar ska fungera, men de är mest ett verktyg.","För mycket fokus på pengar riskerar att göra livet sämre."]],
["Om du tjänar betydligt mer än din partner, hur vill du helst tänka kring ekonomin?",["Den som tjänar mer kan naturligt stå för mer.","Vi bidrar efter förmåga och bygger något gemensamt.","Jag vill ändå att vi betalar ungefär lika mycket.","Jag bryr mig ganska lite om exakt modell så länge båda är nöjda."]],
["Hur viktig är fysisk närhet och sex för dig i en lång relation?",["En av relationens absolut viktigaste delar.","Mycket viktigt, men inte allt.","Viktigt men andra saker kan väga upp långa perioder.","Ganska sekundärt för mig."]],
["När relationen fungerar bra, vilken sexuell vardag känns mest naturlig?",["I princip varje dag.","Flera gånger i veckan.","Ungefär en till två gånger i veckan.","Mer sporadiskt beroende på livet."]],
["Sexlivet har blivit tydligt sämre i två månader. Vad gör du?",["Tar upp det tidigt och försöker aktivt lösa det tillsammans.","Pratar om det men ger situationen lite tid.","Avvaktar länge innan jag gör en grej av det.","Accepterar att sex naturligt försvinner i längre perioder."]],
["Vad tror du främst håller attraktionen levande efter flera år?",["Trygghet och självsäkerhet.","Humor, lekfullhet och energi.","Driv, ambition och att båda fortsätter utvecklas.","Omtanke, romantik och lojalitet."]],
["Vilket beteende hos dig själv skulle du mest vilja undvika för att inte döda attraktionen?",["Att bli passiv och sluta utvecklas.","Att bli känslomässigt frånvarande.","Att bli kontrollerande eller osäker.","Att sluta prioritera fysisk närhet och sex."]],
["Din partner känner svartsjuka av en konkret situation. Hur hanterar du det helst?",["Jag lyssnar och förklarar lugnt vad som hänt.","Jag visar extra tydligt att hon inte behöver oroa sig.","Jag ändrar beteendet om situationen faktiskt är onödigt gränslös.","Jag tycker att kontroll av telefon, planer eller vänner kan vara rimligt."]],
["Hur ser du på att ha nära kvinnliga vänner när du är i en seriös relation?",["Helt okej så länge allt är transparent.","Okej om min partner känner dem och gränserna är tydliga.","Jag kan förstå att sådana relationer ibland behöver bli mer begränsade.","Min partner ska bara acceptera det oavsett hur nära relationerna är."]],
["Ett ex hör av sig helt oskyldigt. Vad gör du?",["Svarar normalt och tänker inte mer på det.","Är öppen med kontakten och ser till att min partner känner sig trygg.","Avslutar helst kontakten för att slippa komplikationer.","Tycker att min partner inte har med saken att göra."]],
["Therese blir jättearg i två minuter men lugnar sig snabbt. Vad passar dig bäst?",["Jag ger henne ett par minuter och pratar sedan normalt.","Jag stannar lugnt kvar men väntar tills hon själv landat.","Jag behöver gå undan länge innan jag vill prata.","Jag möter intensiteten direkt och vill lösa allt på en gång."]],
["Therese säger något vasst i stundens hetta och ber om ursäkt kort därefter. Hur reagerar du?",["Accepterar ursäkten och pratar om sakfrågan.","Behöver ändå lite distans innan jag kan släppa det.","Har svårt att släppa det resten av dagen.","Ger tillbaka lika hårt så att det känns rättvist."]],
["Efter ett stort gräl, vad är viktigast för dig?",["Att kunna släppa det snabbt när problemet är löst.","Att prata igenom det ordentligt och sedan gå vidare.","Att få ganska lång tid för mig själv.","Att reda ut varje detalj innan vi kan vara normala igen."]],
["Hur ser du på att få barn i framtiden?",["Jag vill definitivt ha barn.","Jag vill gärna ha barn om relationen känns rätt.","Jag är ganska osäker.","Jag vill inte ha barn."]],
["Om relationen känns riktigt rätt, när skulle barn kännas realistiskt?",["Inom 1–2 år.","Inom 2–4 år.","Inom 4–6 år.","Jag vill inte sätta någon tidsram alls."]],
["När ni har små barn, hur mycket eget liv bör båda försöka behålla?",["Ganska mycket – båda behöver fortsätta vara individer.","En del, men familjen styr naturligt mycket mer.","Väldigt lite under några år.","Nästan allt bör göras tillsammans som familj."]],
["Hur viktig vill du att resor ska vara i ert gemensamma liv?",["Väldigt viktiga – jag vill upptäcka mycket tillsammans.","Viktiga och något vi gör regelbundet.","Trevligt men inte avgörande.","Ganska oviktigt när vardag och familj är på plats."]],
["Din partner vill resa mer än du själv just då. Hur fungerar det bäst?",["Kör – vi behöver inte göra alla resor tillsammans.","Helt okej så länge vi också prioriterar gemensamma resor.","Jag skulle börja känna att vi lever olika liv.","De flesta resor i en seriös relation bör vara gemensamma."]],
["När båda har krävande jobb, hur ska vardagsansvaret helst lösas?",["Praktiskt efter vem som faktiskt har tid och möjlighet.","Så exakt jämnt fördelat som möjligt.","Det får växla mellan oss beroende på period.","Jag föredrar ganska tydliga fasta roller."]],
["Din partner har en tuff jobbperiod och är mindre närvarande. Vad gör du?",["Ger utrymme och finns där utan att kräva så mycket.","Frågar vad hon behöver men ser också till att hon känner sig sedd.","Jag skulle snabbt känna att relationen blir ett problem.","Jag tycker att jobbet ska skalas ner direkt."]],
["Vilken relation känns mest attraktiv att leva i?",["Två självständiga personer som aktivt väljer varandra.","Ett väldigt nära par som delar nästan allt.","Ett passionerat och intensivt förhållande.","Ett lugnt, stabilt partnerskap med mycket egna rutiner."]],
["Hur viktig är humor mellan dig och din partner?",["Extremt viktig – vi måste kunna skratta och reta varandra.","Väldigt viktig men inte helt avgörande.","Trevlig bonus.","Trygghet och romantik är betydligt viktigare."]],
["Vilket liv låter mest attraktivt om fem år?",["Familj, resor, vänner, jobb och egna intressen i balans.","Familj och ett väldigt tätt gemensamt liv.","Karriär och resor först, familj senare om det passar.","Ett lugnt familjeliv med tydliga rutiner och mindre spontanitet."]]
];
const keys=["A","B","C","D"];let state={name:"Alexander",i:0,answers:{},backDodges:{}};const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
function brand(){return `<div class="brand"><span class="brand-dot"></span>Therese × Alexander</div>`}
function start(){app.innerHTML=`${brand()}<section class="hero"><div class="eyebrow">Nu är rollerna ombytta</div><h1>Alexander. Din tur.</h1><p class="lead">Therese har svarat på hur hon faktiskt vill leva i en relation. Nu får du 32 scenarier byggda på hennes prioriteringar – utan att få facit i förväg.</p><div class="intro-note">Svara som du verkligen fungerar. Inte som du tror Therese vill att du ska svara. Två alternativ kan kännas rimliga – välj då det som stämmer oftast i verkligheten.</div></section><section class="card"><p class="lead" style="font-size:17px">Resultatet mäter hur väl ditt sätt att tänka passar Therese – inte hur "bra pojkvän" du är generellt.</p><button class="start-btn" id="go">Okej Therese, kör då ♥</button><p class="small">32 frågor. Bara ditt namn och dina svar sparas.</p></section>`;document.getElementById('go').onclick=()=>render()}
function dodgeBack(btn){if(state.i===0)return;const count=state.backDodges[state.i]||0;if(count>=2){btn.textContent='Okej då, tillbaka';return}const maxX=window.innerWidth<520?42:72,maxY=window.innerWidth<520?22:30;btn.style.transform=`translate(${(Math.random()*2-1)*maxX}px,${(Math.random()*2-1)*maxY}px)`;btn.textContent=count===0?'Nja… 😏':'Är du säker?';state.backDodges[state.i]=count+1}
function render(){const [text,opts]=questions[state.i],selected=state.answers[state.i];app.innerHTML=`${brand()}<div class="progressbox"><div class="prow"><span>Fråga ${state.i+1} av 32</span><span>${Math.round(state.i/32*100)}%</span></div><div class="progress"><span style="width:${state.i/32*100}%"></span></div></div><section class="card"><div class="qnum">Välj det som ligger närmast dig</div><div class="qtext">${esc(text)}</div><div class="options">${opts.map((o,j)=>`<button class="option ${selected===keys[j]?'sel':''}" data-k="${keys[j]}"><b>${keys[j]}</b>&nbsp;&nbsp;${esc(o)}</button>`).join('')}</div><div class="nav"><button class="back-btn" id="prev" ${state.i===0?'disabled':''}>← Tillbaka</button><div class="heart-wrap"><button class="heart-btn" id="next" ${selected?'':'disabled'} aria-label="${state.i===31?'Skicka':'Nästa'}"><span class="heart-label">${state.i===31?'Skicka':'Nästa'}<br>${state.i===31?'♥':'→'}</span></button></div></div></section>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{state.answers[state.i]=b.dataset.k;render()});const prev=document.getElementById('prev');let touchGuard=false;prev.addEventListener('mouseenter',()=>{if(!prev.disabled)dodgeBack(prev)});prev.addEventListener('touchstart',e=>{if(prev.disabled)return;const count=state.backDodges[state.i]||0;if(count<2){e.preventDefault();touchGuard=true;dodgeBack(prev);setTimeout(()=>touchGuard=false,350)}},{passive:false});prev.onclick=()=>{if(touchGuard)return;if(state.i>0){state.i--;render()}};document.getElementById('next').onclick=()=>{if(!state.answers[state.i])return;if(state.i<31){state.i++;render()}else submit()}}
async function submit(){const form=document.getElementById('netlifyForm');form.elements['name'].value=state.name;for(let i=0;i<32;i++)form.elements[`q${i+1}`].value=state.answers[i]||'';const body=new URLSearchParams(new FormData(form)).toString();try{const r=await fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});if(!r.ok)throw new Error();done()}catch(e){alert('Kunde inte skicka just nu. Försök igen om en stund.')}}
function done(){app.innerHTML=`${brand()}<section class="card done"><div class="check">✓</div><h2>Nu får Therese facit.</h2><p class="lead">Dina svar är inskickade, Alexander. Nu återstår den högst opartiska analysen av hur statistiskt försvarbar du är som pojkvän.</p><div class="intro-note">Relationsdelen räknas på 80 poäng. Therese lägger sedan på sin attraktion 1–10 som upp till 20 poäng. Ja, hon har alltså sista ordet.</div></section>`}
start();
</script>
</body>
</html>
